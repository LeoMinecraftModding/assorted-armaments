plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url = "https://www.cursemaven.com"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }



//    maven { url = "https://packages.aether-mod.net/Emissivity" }
//    maven { url = "https://packages.aether-mod.net/Treasure-Reforging" }
//    maven { url = "https://packages.aether-mod.net/Protect-Your-Moa" }
//    maven { url = "https://packages.aether-mod.net/Beyond-Parity" }
//    maven { url = "https://packages.aether-mod.net/The-Aether-Genesis" }
    maven { url = "https://packages.aether-mod.net/The-Aether" }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.fabricmc.net' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    //Jei
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    //Compat
    compileOnly "curse.maven:eternal-starlight-1080592:8931080"
    implementation "curse.maven:the-twilight-forest-227639:7797302"
    implementation "curse.maven:aquaculture-60028:7901588"

    //Aether owoowoowoowoowoowoowoowoowoowoowoowoowoowo
    implementation("com.aetherteam.aether:aether:1.21.1-1.5.10-neoforge")
    implementation("com.aetherteam.nitrogen:nitrogen_internals:1.21.1-1.1.25-neoforge")
    implementation("com.aetherteam.cumulus:cumulus_menus:1.21.1-2.0.2-neoforge")
    implementation("io.wispforest:accessories-neoforge:1.1.0-beta.16+1.21.1")

    //Test
    runtimeOnly "curse.maven:inventory-hud-forge-357540:6369797"
    runtimeOnly "curse.maven:re-retro-damage-indicators-1456876:7921238"
    runtimeOnly "curse.maven:selene-499980:9066398"
    runtimeOnly "curse.maven:mmmmmmmmmmmm-225738:8903254"
    runtimeOnly "curse.maven:better-combat-by-daedelus-639842:8430183"
    runtimeOnly "curse.maven:playeranimator-658587:7389814"
    runtimeOnly "curse.maven:cloth-config-348521:5729127"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
